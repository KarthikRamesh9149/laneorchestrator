name: Bug report
description: Report reproducible incorrect or unsafe LaneOrchestrator behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the route output and remove credentials or private repository data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the command, objective, flags, and relevant capability metadata.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13.5
    validations:
      required: true

name: Bug report
description: Report reproducible incorrect or unsafe LaneOrchestrator behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md for private vulnerability reporting. Remove secrets, access tokens, private paths, private repository content, and exploit details from this public form.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the route output and remove credentials or private repository data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the command, objective, flags, and relevant capability metadata.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.13.5
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source version and commit
      description: Release tag or main, plus the Git commit. The source Astra version still reports package version 0.2.4.
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex client and version
      description: Desktop or CLI; include the version and whether this was a new task after installation.
    validations:
      required: true
  - type: textarea
    id: dispatch
    attributes:
      label: Model selection and readiness
      description: For routing issues, include selected model/thinking and sanitized doctor or status output. Mark runtime-observed settings unknown if unavailable.

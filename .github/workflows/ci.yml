name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: POSIX Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate repository
        run: sh scripts/validate.sh

  windows-control-plane:
    name: Windows read-only control plane Python ${{ matrix.python }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run explicit native-Windows read-only partition
        shell: pwsh
        run: >-
          python -m unittest -v
          tests.test_models tests.test_diagnostics tests.test_routing_api
          tests.test_routing_matrix tests.test_routes
          tests.test_plugin_manifests tests.test_repository

  candidate-evidence:
    name: Verify candidate distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Generate benchmark evidence
        run: python -m laneorchestrator benchmark --json > "$RUNNER_TEMP/benchmark.json"
      - name: Build and verify candidate assets
        id: release-assets
        run: |
          version="$(python -c 'from laneorchestrator import __version__; print(__version__)')"
          tar="laneorchestrator-${version}.tar.gz"
          zip="laneorchestrator-${version}.zip"
          python scripts/build_release.py --output "$RUNNER_TEMP/release"
          python scripts/verify_release.py "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$tar"
          test -f "$RUNNER_TEMP/release/$zip"
          printf 'tar=%s\nzip=%s\nsums=SHA256SUMS\n' "$tar" "$zip" >> "$GITHUB_OUTPUT"
      - name: Upload candidate benchmark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmark.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Upload candidate distribution assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-assets-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/release/${{ steps.release-assets.outputs.tar }}
            ${{ runner.temp }}/release/${{ steps.release-assets.outputs.zip }}
            ${{ runner.temp }}/release/${{ steps.release-assets.outputs.sums }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

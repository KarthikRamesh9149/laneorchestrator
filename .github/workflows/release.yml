name: Release evidence

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Assert immutable tag and version agreement
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          version=$(python -c 'from laneorchestrator import __version__; print(__version__)')
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"
      - name: Build and verify release assets
        id: release-assets
        run: |
          version="$(python -c 'from laneorchestrator import __version__; print(__version__)')"
          tar="laneorchestrator-${version}.tar.gz"
          zip="laneorchestrator-${version}.zip"
          python scripts/build_release.py --output "$RUNNER_TEMP/release"
          python scripts/verify_release.py "$RUNNER_TEMP/release"
          test -f "$RUNNER_TEMP/release/$tar"
          test -f "$RUNNER_TEMP/release/$zip"
          printf 'tar=%s\nzip=%s\nsums=SHA256SUMS\n' "$tar" "$zip" >> "$GITHUB_OUTPUT"
      - name: Upload verified release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ github.ref_name }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/${{ steps.release-assets.outputs.tar }}
            ${{ runner.temp }}/release/${{ steps.release-assets.outputs.zip }}
            ${{ runner.temp }}/release/${{ steps.release-assets.outputs.sums }}
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

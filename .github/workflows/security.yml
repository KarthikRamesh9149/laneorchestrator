name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-static-analysis:
    if: ${{ github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run bounded private static analysis
        run: >-
          python scripts/private_static_analysis.py
          --source laneorchestrator --source scripts
          --source skills/laneorchestrator/scripts
          --output "${{ runner.temp }}/private-static-analysis.sarif"
      - name: Require SARIF from successful private analysis
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${RUNNER_TEMP}/private-static-analysis.sarif"
      - name: Preserve private static-analysis SARIF evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: private-static-analysis-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/private-static-analysis.sarif
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: false

  public-codeql:
    if: ${{ !github.event.repository.private }}
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none
      - name: Analyze and upload CodeQL results
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          upload: always
          upload-database: true
